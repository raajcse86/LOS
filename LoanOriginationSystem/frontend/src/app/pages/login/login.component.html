<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">Sign in to your account</h2>
      <p class="mt-2 text-center text-sm text-gray-600">For demo, use username: <span class="font-bold">user1</span> and password: <span class="font-bold">test123</span></p>
    </div>
    
    <div class="mt-8">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Error message -->
        <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
          <span class="block sm:inline">{{ errorMessage }}</span>
        </div>
        
        <!-- Username -->
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
          <div class="mt-1">
            <input 
              id="username" 
              formControlName="username" 
              name="username" 
              type="text" 
              autocomplete="username" 
              required 
              class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-red-500 focus:border-red-500 sm:text-sm"
            >
          </div>
          <div *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.hasError('required')" class="mt-1 text-sm text-red-500">
            Username is required
          </div>
        </div>
        
        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <div class="mt-1">
            <input 
              id="password" 
              formControlName="password" 
              name="password" 
              type="password" 
              autocomplete="current-password" 
              required 
              class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-red-500 focus:border-red-500 sm:text-sm"
            >
          </div>
          <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')" class="mt-1 text-sm text-red-500">
            Password is required
          </div>
        </div>
        
        <!-- Submit Button -->
        <div>
          <button type="submit" [disabled]="loginForm.invalid || isSubmitting" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 disabled:opacity-50">
            <span *ngIf="!isSubmitting">Sign in</span>
            <span *ngIf="isSubmitting">Signing in...</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
