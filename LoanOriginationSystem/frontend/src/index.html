<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Loan Origination System</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="container mx-auto px-4 py-8">
    <header class="bg-white shadow rounded-lg mb-6">
      <div class="px-4 py-3">
        <h1 class="text-xl font-bold text-red-600">Loan Origination System</h1>
      </div>
    </header>
    
    <main class="bg-white p-6 rounded-lg shadow-md">
      <div class="text-center">
        <h2 class="text-2xl font-bold mb-4">Welcome to the Loan Origination System</h2>
        <p class="mb-4">This is a demonstration of the Loan Origination System</p>
        
        <div class="mt-6 p-6 bg-blue-50 rounded-lg">
          <h3 class="text-lg font-semibold mb-2">Login</h3>
          <form class="max-w-md mx-auto">
            <div class="mb-4">
              <label class="block text-gray-700 text-sm font-bold mb-2" for="username">
                Username
              </label>
              <input 
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" 
                id="username" 
                type="text" 
                placeholder="Username">
            </div>
            <div class="mb-6">
              <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
                Password
              </label>
              <input 
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" 
                id="password" 
                type="password" 
                placeholder="******************">
            </div>
            <div class="flex items-center justify-between">
              <button 
                class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" 
                type="button">
                Sign In
              </button>
            </div>
            <div class="mt-4 text-sm text-gray-600">
              <p>Demo credentials:</p>
              <p>Username: <strong>user1</strong></p>
              <p>Password: <strong>test123</strong></p>
            </div>
          </form>
        </div>
      </div>
    </main>
    
    <footer class="bg-white shadow rounded-lg mt-6 py-4">
      <div class="text-center text-gray-500 text-sm">
        &copy; 2025 Loan Origination System. All rights reserved.
      </div>
    </footer>
  </div>
  <app-root></app-root>
</body>
</html>
